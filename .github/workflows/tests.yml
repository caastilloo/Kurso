name: Pruebas

on:
  push:
  pull_request:

jobs:
  test:
    # Windows, porque las credenciales se cifran con DPAPI y algunas pruebas lo usan.
    runs-on: windows-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
